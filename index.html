<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>OMNISCAN – ULTRA SNIPER 1H</title>
<style>
body { background:#000; color:#0f0; font-family:monospace; padding:10px; }
h1 { color:#0ff; }
.signal { border-bottom:1px solid #0f0; padding:10px 0; }
.risk { color:red; }
.warn { color:orange; }
.growth { color:#00ffff; }
.spike { color:#ff00ff; }
input { width:100%; background:#111; color:#0f0; border:none; padding:2px; }
button { margin-top:4px; cursor:pointer; background:#111; color:#0f0; border:1px solid #0f0; padding:2px 5px; }
</style>
</head>
<body>

<h1>OMNISCAN – 1H ULTRA SNIPER</h1>
<div id="output">Scanning...</div>

<script>
const ONE_HOUR = 60*60*1000;
const MIN_SCORE = 60;
let history = {};

function copyAddr(id){ navigator.clipboard.writeText(document.getElementById(id).value); alert("Copied!"); }

async function scan(){
  const output = document.getElementById("output");
  try{
    // Folosim proxy public CORS pentru DEXscreener
    const proxy = "https://api.allorigins.win/get?url=";
    const target = encodeURIComponent("https://api.dexscreener.com/latest/dex/pairs/solana");
    const res = await fetch(proxy+target);
    const jsonText = await res.json();
    const data = JSON.parse(jsonText.contents);

    const now = Date.now();
    let results = [];

    for(const p of data.pairs){
      if(p.chainId!=="solana"||!p.pairCreatedAt||now-p.pairCreatedAt>ONE_HOUR) continue;
      const symbol = p.baseToken.symbol;
      if(["SOL","USDC","USDT"].includes(symbol)||symbol.includes("SOL")) continue;

      const address = p.baseToken.address;
      const liquidity = parseFloat(p.liquidity?.usd||0);
      const volume24 = parseFloat(p.volume?.h24||0);
      const volume5m = parseFloat(p.volume?.m5||0);
      const fdv = parseFloat(p.fdv||0);

      let score=0;
      if(liquidity>10000) score+=20;
      if(volume24>8000) score+=20;
      if(volume5m>liquidity*0.3) score+=15;
      if(volume24>liquidity) score+=15;
      if(fdv>0 && fdv<1500000) score+=10;
      if(volume24>liquidity*1.5) score+=10;

      let lpGrowth=false, volumeSpike=false;
      if(history[address]){
        const prev=history[address];
        if(liquidity>prev.liquidity*1.3){ lpGrowth=true; score+=5; }
        if(volume24>prev.volume24*1.5){ volumeSpike=true; score+=5; }
      }
      history[address]={liquidity,volume24};

      const rugpull=liquidity<2000||fdv>50000000||volume24<1000;
      const honeypot=liquidity<3000 && volume24>liquidity*2;
      const whaleRisk=fdv>0 && liquidity/fdv<0.05;

      if(score>=MIN_SCORE){
        results.push({symbol,price:p.priceUsd,address,liquidity,volume24,volume5m,fdv,score, rugpull, honeypot, whaleRisk, lpGrowth, volumeSpike});
      }
    }

    results = results.sort((a,b)=>b.score-a.score).slice(0,5);

    if(results.length===0){ output.innerHTML="⚠ No sniper opportunities detected."; return; }

    output.innerHTML = results.map((t,i)=>`
      <div class="signal">
        🚀 ${t.symbol} | Score: ${t.score}% | Price: ${t.price}<br>
        Liquidity: $${t.liquidity}<br>
        Volume 24h: $${t.volume24}<br>
        Volume 5m: $${t.volume5m}<br>
        FDV: $${t.fdv}<br>
        ${t.rugpull?'<span class="risk">⚠ Rugpull Risk</span>':''}
        ${t.honeypot?'<span class="warn"> ⚠ Honeypot Risk</span>':''}
        ${t.whaleRisk?'<span class="warn"> ⚠ Whale Control</span>':''}
        ${t.lpGrowth?'<span class="growth"> 💧 LP Added</span>':''}
        ${t.volumeSpike?'<span class="spike"> 💥 Volume Explosion</span>':''}
        <br>
        <input id="addr${i}" value="${t.address}" readonly>
        <button onclick="copyAddr('addr${i}')">Copy Address</button>
      </div>
    `).join("");

  }catch(e){ output.innerHTML="Error fetching data."; console.error(e); }
}

scan();
setInterval(scan,30000);
</script>
</body>
</html>
